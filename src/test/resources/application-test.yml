spring:
  application:
    name: bank-ivr-auth-system-test
  
  # Disable Redis for tests - use in-memory implementation
  data:
    redis:
      repositories:
        enabled: false
  
  # Jackson configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# Server configuration for tests
server:
  port: 0 # Random port for tests

# Logging configuration for tests
logging:
  level:
    com.bank.ivr.auth: DEBUG
    org.springframework.security: WARN
    org.springframework.data.redis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management endpoints disabled for tests
management:
  endpoints:
    enabled-by-default: false

# Custom application properties for tests
app:
  auth:
    default-session-timeout: 5m
    max-overall-attempts: 3
    redis-key-prefix: "test:auth:context:" 